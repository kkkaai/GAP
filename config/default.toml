[phase1_mask]
mode = "precomputed"
precomputed_mask_path = "testcase/coffeecup_hand_mask.png"
text_prompt = "hand. coffee cup."
box_threshold = 0.25
text_threshold = 0.25

[phase3_inpaint]
model_id = "diffusers/stable-diffusion-xl-1.0-inpainting-0.1"
prompt = "background preserved, object preserved, realistic completion behind removed hand, no human hand visible"
guidance_scale = 8.0
strength = 0.99
num_inference_steps = 30
pad_ratio = 0.25

[phase4_flux_fill]
mode = "local"
model_id = "black-forest-labs/FLUX.1-Fill-dev"
prompt = "A highly realistic background behind the object, no human hand, seamless continuation of the surface, extremely detailed, 8k"
guidance_scale = 30.0
num_inference_steps = 50
pad_ratio = 0.25
