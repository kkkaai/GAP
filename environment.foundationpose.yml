name: foundationpose
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - cmake
  - ninja
  - eigen
  - boost-cpp
  - pybind11
  - cxx-compiler
  - cuda-nvcc=12.8.*
  - cuda-cudart-dev=12.8.*
  - cuda-libraries-dev=12.8.*

# After creating this environment:
#   conda activate foundationpose
#   cd external/FoundationPose
#   python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
#   python -m pip install -r requirements.txt
#
# Build source packages with low parallelism on 32GB RAM:
#   export CUDA_HOME="$CONDA_PREFIX"
#   export PATH="$CUDA_HOME/bin:/usr/bin:$PATH"
#   export CC=/usr/bin/gcc-11
#   export CXX=/usr/bin/g++-11
#   export CUDAHOSTCXX=/usr/bin/g++-11
#   export TORCH_CUDA_ARCH_LIST="12.0"
#   export MAX_JOBS=1
#   export CMAKE_BUILD_PARALLEL_LEVEL=1
#   export NINJAFLAGS="-j1"
#   python -m pip install --no-build-isolation "git+https://github.com/facebookresearch/pytorch3d.git"
#   python -m pip install --no-build-isolation "git+https://github.com/NVlabs/nvdiffrast.git"
