[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosthetic-grasp-generation"
version = "0.1.0"
description = "Minimal V1 scaffold for prosthetic grasp generation via image synthesis."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
flux-stage = [
  "matplotlib>=3.8",
  "opencv-python>=4.9",
  "scipy>=1.11",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "diffusers",
  "transformers",
  "accelerate",
  "peft",
  "huggingface_hub",
  "safetensors",
]
camera = [
  "pyrealsense2",
]
seggpt = [
  "torch",
  "transformers",
  "accelerate",
  "safetensors",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
